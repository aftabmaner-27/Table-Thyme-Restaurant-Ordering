<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff7a00">
  <meta name="description" content="A complete restaurant table, QR ordering and management demo.">
  <title>Table & Thyme — Restaurant Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#menu" aria-label="Table and Thyme home">
        <span class="brand-mark">T<span>&</span></span>
        <span class="brand-copy"><strong>table <i>&</i> thyme</strong><small>GOOD FOOD. GOOD COMPANY.</small></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="menu">Menu</button>
        <button class="nav-link" data-page="tracking">Track order</button>
        <!-- <a class="nav-link admin-nav" href="admin.html">Admin</a> -->
      </nav>
      <div class="topbar-actions">
        <button class="icon-button theme-settings-button" data-theme-settings type="button" aria-label="Appearance settings" title="Appearance settings">◐</button>
        <span class="table-chip">⌖ <span id="header-table">Table 05</span></span>
        <button class="icon-button cart-shortcut" data-page="cart" aria-label="Open cart">♧<span id="cart-count" class="count-badge">0</span></button>
      </div>
    </header>
    <main id="app" class="page-container" tabindex="-1"></main>
    <footer class="site-footer"><span>Table & Thyme</span><span>Made for memorable meals.</span></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
